services:
  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    container_name: parko-access-keycloak
    command: start-dev
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
    ports:
      - "8180:8080"
    volumes:
      - parko-access-keycloak-data:/opt/keycloak/data

volumes:
  parko-access-keycloak-data:
