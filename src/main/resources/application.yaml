server:
  port: 8081

spring:
  application:
    name: access.service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/parko_db}
    username: ${DB_USERNAME:user}
    password: ${DB_PASSWORD:password}
  jpa:
    hibernate:
      ddl-auto: update
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/Parko}

keycloak:
  token-uri: ${KEYCLOAK_TOKEN_URI:http://localhost:8180/realms/Parko/protocol/openid-connect/token}
  client-id: ${KEYCLOAK_CLIENT_ID}
  client-secret: ${KEYCLOAK_CLIENT_SECRET}

balance-service:
  base-url: ${BALANCE_SERVICE_URL:http://localhost:8082}

parking:
  entry-fee: ${PARKING_ENTRY_FEE:1500}
